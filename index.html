<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Live Photo Converter</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; padding: 20px 16px 40px;
    background: #111827; color: #f9fafb;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  .wrap { width: 100%; max-width: 440px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  p.sub { margin: 0 0 20px; color: #9ca3af; font-size: 14px; line-height: 1.5; }
  .card { background: #1f2937; border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .pick {
    display: block; text-align: center; padding: 22px 12px;
    border: 2px dashed #4b5563; border-radius: 14px; cursor: pointer;
    color: #d1d5db; font-size: 15px;
  }
  .pick strong { color: #fff; }
  input[type=file] { display: none; }
  button {
    width: 100%; padding: 14px; border: 0; border-radius: 12px;
    font-size: 16px; font-weight: 600; cursor: pointer;
    background: #6366f1; color: #fff; margin-top: 10px;
  }
  button.alt { background: #374151; }
  button:disabled { opacity: .45; }
  #status { font-size: 14px; color: #9ca3af; margin-top: 10px; min-height: 20px; white-space: pre-line; }
  #status.err { color: #fca5a5; }
  #status.ok  { color: #86efac; }
  canvas#preview { width: 100%; height: auto; border-radius: 12px; display: block; background: #000; }
  .row { display: flex; gap: 10px; }
  .row button { margin-top: 10px; }
  .note { font-size: 12px; color: #6b7280; line-height: 1.5; margin-top: 8px; }
  .lbl { display: flex; justify-content: space-between; font-size: 14px; color: #d1d5db; margin: 14px 0 6px; }
  input[type=range] { width: 100%; accent-color: #6366f1; }
  select {
    width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #4b5563;
    background: #111827; color: #f9fafb; font-size: 15px;
  }

  /* ── Slider potong: 1 track, 2 gagang ── */
  .dual { position: relative; height: 36px; margin-top: 2px; }
  .dual .track, .dual .fill {
    position: absolute; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px;
  }
  .dual .track { left: 0; right: 0; background: #374151; }
  .dual .fill  { background: #6366f1; left: 0; width: 100%; }
  .dual input[type=range] {
    position: absolute; left: 0; top: 0; width: 100%; height: 36px; margin: 0;
    background: transparent; pointer-events: none;
    -webkit-appearance: none; appearance: none;
  }
  .dual input[type=range]::-webkit-slider-runnable-track { background: transparent; height: 36px; }
  .dual input[type=range]::-moz-range-track { background: transparent; height: 36px; }
  .dual input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; pointer-events: auto;
    width: 26px; height: 26px; margin-top: 5px; border-radius: 50%;
    background: #fff; border: 4px solid #6366f1; cursor: grab;
  }
  .dual input[type=range]::-moz-range-thumb {
    pointer-events: auto; width: 18px; height: 18px; border-radius: 50%;
    background: #fff; border: 4px solid #6366f1; cursor: grab;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>📸 Live Photo Converter</h1>
  <p class="sub">Ubah video jadi foto live (Motion Photo). Foto bisa dipilih dari frame mana saja. Semua proses dilakukan di browser, tidak ada yang diupload ke server.</p>

  <div class="card">
    <label class="pick" for="file"><strong id="pickText">Pilih video</strong><br>min. 3 detik, format MP4</label>
    <input id="file" type="file" accept="video/*">
    <div id="status"></div>
  </div>

  <div class="card" id="resultCard" style="display:none">
    <canvas id="preview"></canvas>

    <div class="lbl"><span>Frame untuk foto</span><span><span id="frameVal">0.00</span> dtk</span></div>
    <input id="frame" type="range" min="0" max="1" step="0.05" value="0">

    <div class="lbl"><span>Resolusi</span></div>
    <select id="res"></select>
    <div class="note" id="resNote"></div>

    <div class="lbl"><span>Potong video</span><span id="durVal">0.0 dtk</span></div>
    <div class="dual">
      <div class="track"></div>
      <div class="fill" id="fill"></div>
      <input id="durA" type="range" min="0" max="1" step="any" value="0">
      <input id="durB" type="range" min="0" max="1" step="any" value="1">
    </div>
    <div class="lbl" style="margin-top:0"><span id="durFrom">0.0</span><span id="durTo">0.0</span></div>

    <button id="btnBuild">⚙️ Buat Live Photo</button>

    <div id="outputs" style="display:none">
      <div class="row">
        <button id="btnSave">💾 Simpan Live Photo</button>
      </div>
      <div class="row">
        <button class="alt" id="btnShare">📤 Bagikan</button>
        <button class="alt" id="btnPhoto">🖼️ Foto saja</button>
      </div>
      <div class="row">
        <button class="alt" id="btnVideo">🎬 Video saja (.mp4)</button>
      </div>
    </div>
    <div class="note">Bisa dikirim di wa kalo support :).</div>
  </div>
</div>

<script>
const MIN_SEC = 3;

const $ = (id) => document.getElementById(id);
const fileEl = $("file"), statusEl = $("status");
let src = null;     // { file, url, video, dur, vw, vh }
let result = null;  // { livePhoto: Blob, photo: Blob, name: string }

function setStatus(msg, cls = "") { statusEl.textContent = msg; statusEl.className = cls; }
const even = (n) => Math.max(2, Math.round(n / 2) * 2);

// ── XMP Motion Photo (Container + legacy MicroVideo) ─────────────────────────
function buildXmp(videoLen, tsUs = 0) {
  const xml =
`<?xpacket begin="\uFEFF" id="W5M0MpCehiHzreSzNTczkc9d"?>
<x:xmpmeta xmlns:x="adobe:ns:meta/" x:xmptk="lp-app">
  <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
    <rdf:Description rdf:about=""
      xmlns:GCamera="http://ns.google.com/photos/1.0/camera/"
      xmlns:Container="http://ns.google.com/photos/1.0/container/"
      xmlns:Item="http://ns.google.com/photos/1.0/container/item/"
      GCamera:MotionPhoto="1"
      GCamera:MotionPhotoVersion="1"
      GCamera:MotionPhotoPresentationTimestampUs="${tsUs}"
      GCamera:MicroVideo="1"
      GCamera:MicroVideoVersion="1"
      GCamera:MicroVideoOffset="${videoLen}"
      GCamera:MicroVideoPresentationTimestampUs="${tsUs}">
      <Container:Directory>
        <rdf:Seq>
          <rdf:li rdf:parseType="Resource">
            <Container:Item Item:Mime="image/jpeg" Item:Semantic="Primary" Item:Length="0" Item:Padding="0"/>
          </rdf:li>
          <rdf:li rdf:parseType="Resource">
            <Container:Item Item:Mime="video/mp4" Item:Semantic="MotionPhoto" Item:Length="${videoLen}" Item:Padding="0"/>
          </rdf:li>
        </rdf:Seq>
      </Container:Directory>
    </rdf:Description>
  </rdf:RDF>
</x:xmpmeta>
<?xpacket end="w"?>`;
  const enc = new TextEncoder();
  const header = enc.encode("http://ns.adobe.com/xap/1.0/\0");
  const body = enc.encode(xml);
  const len = 2 + header.length + body.length;
  if (len > 0xffff) throw new Error("XMP terlalu besar");
  const out = new Uint8Array(4 + header.length + body.length);
  out[0] = 0xff; out[1] = 0xe1; out[2] = len >> 8; out[3] = len & 0xff;
  out.set(header, 4);
  out.set(body, 4 + header.length);
  return out;
}

function makeMotionPhoto(jpg, mp4, tsUs = 0) {
  if (jpg[0] !== 0xff || jpg[1] !== 0xd8) throw new Error("Bukan JPEG valid");
  let pos = 2;
  while (jpg[pos] === 0xff && jpg[pos + 1] === 0xe0) {   // lewati APP0/JFIF
    pos += 2 + ((jpg[pos + 2] << 8) | jpg[pos + 3]);
  }
  return new Blob([jpg.subarray(0, pos), buildXmp(mp4.length, tsUs), jpg.subarray(pos), mp4],
                  { type: "image/jpeg" });
}

// ── Video helpers ────────────────────────────────────────────────────────────
function loadVideo(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;

    const fail = (m) => { URL.revokeObjectURL(url); reject(new Error(m)); };
    v.onerror = () => fail("Video tidak bisa dibaca. Coba video MP4 (H.264).");
    v.onloadeddata = () => {
      const dur = v.duration;
      if (!isFinite(dur)) return fail("Durasi video tidak terbaca.");
      if (dur < MIN_SEC) return fail(`Durasi video ${dur.toFixed(1)} detik.\nMinimal ${MIN_SEC} detik.`);
      resolve({ file, url, video: v, dur, vw: v.videoWidth, vh: v.videoHeight });
    };
  });
}

// Loncat ke waktu t lalu tunggu frame benar-benar tampil
function seekTo(v, t) {
  return new Promise((resolve) => {
    const finish = () => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(resolve, 40)));
    if (Math.abs(v.currentTime - t) < 0.001 && v.readyState >= 2) return finish();
    v.addEventListener("seeked", finish, { once: true });
    setTimeout(resolve, 3000); // jaga-jaga
    v.currentTime = t;
  });
}

function drawFrame(canvas, v, w, h) {
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(v, 0, 0, w, h);
}

// ── Resolusi ─────────────────────────────────────────────────────────────────
function fillRes() {
  const short = Math.min(src.vw, src.vh);
  const sel = $("res");
  sel.innerHTML = "";
  sel.add(new Option(`Asli (${src.vw}×${src.vh})`, "0"));
  [1080, 720, 480].filter((r) => r < short).forEach((r) => {
    const k = r / short;
    sel.add(new Option(`${r}p (${even(src.vw * k)}×${even(src.vh * k)})`, String(r)));
  });
  sel.value = "0";
  updateResNote();
}

function target() {
  const short = Number($("res").value);
  if (!short) return { w: src.vw, h: src.vh, scaled: false };
  const k = short / Math.min(src.vw, src.vh);
  return { w: even(src.vw * k), h: even(src.vh * k), scaled: true };
}

function pickMime() {
  if (typeof MediaRecorder === "undefined") return null;
  return ["video/mp4;codecs=avc1.640028,mp4a.40.2", "video/mp4;codecs=avc1.42E01E,mp4a.40.2", "video/mp4;codecs=avc1.640028", "video/mp4;codecs=avc1.42E01E", "video/mp4;codecs=avc1", "video/mp4"]
    .find((t) => MediaRecorder.isTypeSupported(t)) || null;
}

// ── Potong durasi (awal & akhir dalam 1 slider) ─────────────────────────────
function trimStart() { return Number($("durA").value); }
function trimEnd()   { return Number($("durB").value); }
function isTrimmed() { return !!src && (trimStart() > 0.05 || trimEnd() < src.dur - 0.05); }

function updateResNote() {
  const note = $("resNote");
  const scaled = !!Number($("res").value);
  if (!scaled && !isTrimmed()) {
    note.textContent = "Video dipakai apa adanya, kualitas video sama persis dengan file aslinya.";
  } else if (pickMime()) {
    note.textContent = "Resolusi/durasi diubah, jadi video di-encode ulang. Prosesnya selama durasi video. Suara ikut kalau browser mendukung.";
  } else {
    note.textContent = "Browser ini tidak bisa encode MP4: video tetap asli (resolusi dan durasi penuh), hanya foto yang diperkecil.";
  }
}

function updateDurLabel() {
  const a = trimStart(), b = trimEnd();
  $("durVal").textContent = isTrimmed() ? `${(b - a).toFixed(1)} dtk` : `${src.dur.toFixed(1)} dtk (penuh)`;
  $("durFrom").textContent = a.toFixed(1) + " dtk";
  $("durTo").textContent = b.toFixed(1) + " dtk";
  const fill = $("fill");
  fill.style.left = (a / src.dur * 100) + "%";
  fill.style.width = ((b - a) / src.dur * 100) + "%";
}

function invalidate() { result = null; $("outputs").style.display = "none"; }

// ── Preview frame ────────────────────────────────────────────────────────────
let seekToken = 0;
async function updatePreview() {
  if (!src) return;
  const t = Number($("frame").value);
  $("frameVal").textContent = t.toFixed(2);
  const tok = ++seekToken;
  await seekTo(src.video, t);
  if (tok !== seekToken) return;
  const k = Math.min(1, 960 / Math.max(src.vw, src.vh));
  drawFrame($("preview"), src.video, Math.round(src.vw * k), Math.round(src.vh * k));
}

$("frame").addEventListener("input", () => { invalidate(); updatePreview(); });
$("res").addEventListener("change", () => { invalidate(); updateResNote(); });

// Frame foto harus tetap di dalam bagian video yang dipakai
function syncFrameRange(follow) {
  const a = trimStart(), b = trimEnd();
  const f = $("frame");
  f.min = String(a); f.max = String(b);
  let t = Number(f.value);
  if (follow !== undefined) t = follow;           // gagang yang digeser, preview ikut
  const c = Math.min(b, Math.max(a, t));
  if (c !== Number(f.value) || follow !== undefined) { f.value = String(c); updatePreview(); }
}

function onTrim(which) {
  invalidate();
  const A = $("durA"), B = $("durB");
  let a = Number(A.value), b = Number(B.value);
  if (which === "A" && b - a < MIN_SEC) { a = Math.max(0, b - MIN_SEC); A.value = String(a); }
  if (which === "B" && b - a < MIN_SEC) { b = Math.min(src.dur, a + MIN_SEC); B.value = String(b); }
  // kalau sisa video pas 3 dtk dan mentok, dorong gagang satunya
  if (b - a < MIN_SEC - 1e-6) {
    if (which === "A") { b = Math.min(src.dur, a + MIN_SEC); B.value = String(b); }
    else               { a = Math.max(0, b - MIN_SEC);       A.value = String(a); }
  }
  updateDurLabel(); updateResNote();
  syncFrameRange(which === "A" ? a : b);
}
$("durA").addEventListener("input", () => onTrim("A"));
$("durB").addEventListener("input", () => onTrim("B"));

// ── Encode ulang video ke resolusi target (real-time via MediaRecorder) ─────
async function encodeVideo(mime, w, h, startSec, endSec, onProgress) {
  const v = document.createElement("video");
  v.muted = true; v.playsInline = true; v.src = src.url;
  await new Promise((res, rej) => {
    v.onloadeddata = res;
    v.onerror = () => rej(new Error("Gagal membuka video untuk encode."));
  });

  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = "high";

  const fps = 30;
  const stream = c.captureStream(fps);

  // Ambil audio dari video (tanpa diputar lewat speaker)
  let actx = null;
  try {
    v.muted = false;
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const node = actx.createMediaElementSource(v);
    const dest = actx.createMediaStreamDestination();
    node.connect(dest);
    dest.stream.getAudioTracks().forEach((t) => stream.addTrack(t));
    if (actx.state === "suspended") await actx.resume();
  } catch (e) { v.muted = true; }

  const rec = new MediaRecorder(stream, {
    mimeType: mime,
    videoBitsPerSecond: Math.round(Math.min(20e6, Math.max(3e6, w * h * fps * 0.14)))
  });
  const chunks = [];
  rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  const stopped = new Promise((res) => { rec.onstop = res; });
  let endResolve;
  const ended = new Promise((res) => { endResolve = res; v.onended = res; });

  const span = Math.max(0.1, endSec - startSec);
  let raf;
  const tick = () => {
    if (v.currentTime >= endSec) { v.pause(); endResolve(); return; }
    ctx.drawImage(v, 0, 0, w, h);
    onProgress(Math.min(1, Math.max(0, (v.currentTime - startSec) / span)));
    raf = requestAnimationFrame(tick);
  };

  await seekTo(v, startSec);
  ctx.drawImage(v, 0, 0, w, h);
  try { await v.play(); }
  catch (e) { v.muted = true; await v.play(); }   // fallback: tanpa suara
  rec.start();
  tick();
  await ended;
  ctx.drawImage(v, 0, 0, w, h);
  await new Promise((r) => setTimeout(r, 150));
  cancelAnimationFrame(raf);
  rec.stop();
  await stopped;
  if (actx) actx.close();
  return new Uint8Array(await new Blob(chunks, { type: mime }).arrayBuffer());
}

// ── Proses ───────────────────────────────────────────────────────────────────
fileEl.addEventListener("change", async () => {
  const file = fileEl.files[0];
  if (!file) return;
  if (src) URL.revokeObjectURL(src.url);
  src = null; invalidate();
  $("resultCard").style.display = "none";
  $("pickText").textContent = file.name;
  setStatus("⏳ Membaca video...");

  try {
    src = await loadVideo(file);
    for (const id of ["durA", "durB"]) { $(id).min = "0"; $(id).max = String(src.dur); }
    $("durA").value = "0";
    $("durB").value = String(src.dur);
    $("frame").min = "0";
    $("frame").max = String(src.dur);
    $("frame").value = "0";
    updateDurLabel();
    fillRes();
    $("resultCard").style.display = "block";
    await updatePreview();
    const warn = /mp4/i.test(file.type) ? "" :
      "\n⚠️ Video bukan MP4, hasil mungkin tidak bisa diputar sebagai live.";
    setStatus(`✅ Video terbaca: ${src.vw}×${src.vh}, ${src.dur.toFixed(1)} detik\nPilih frame dan resolusi, lalu tekan Buat.${warn}`, "ok");
  } catch (e) {
    setStatus("❌ " + e.message, "err");
  }
});

$("btnBuild").onclick = async () => {
  if (!src) return;
  const btn = $("btnBuild");
  btn.disabled = true; invalidate();
  try {
    const t = Number($("frame").value);
    const { w, h, scaled } = target();
    const a = trimStart(), b = trimEnd();

    setStatus("⏳ Membuat foto...");
    await seekTo(src.video, t);
    const c = document.createElement("canvas");
    drawFrame(c, src.video, w, h);
    const photo = await new Promise((res, rej) =>
      c.toBlob((bl) => (bl ? res(bl) : rej(new Error("Gagal membuat foto."))), "image/jpeg", 0.98));

    let mp4, note = "";
    const trimmed = isTrimmed();
    const needEnc = scaled || trimmed;
    const mime = needEnc ? pickMime() : null;
    if (needEnc && mime) {
      const msg = (p) => `⏳ Encode video ${Math.round(p * 100)}%\nJangan pindah tab atau kunci layar.`;
      setStatus(msg(0));
      mp4 = await encodeVideo(mime, even(w), even(h), trimmed ? a : 0, trimmed ? b : src.dur, (p) => setStatus(msg(p)));
    } else {
      mp4 = new Uint8Array(await src.file.arrayBuffer());
      if (needEnc) note = "\n⚠️ Browser tidak bisa encode MP4, video tetap asli (resolusi dan durasi penuh).";
    }

    const jpg = new Uint8Array(await photo.arrayBuffer());
    // timestamp selalu 0: video diputar penuh dari awal, walau frame foto dipilih di detik lain
    const live = makeMotionPhoto(jpg, mp4, 0);
    const code = String(Math.floor(Math.random() * 1e6)).padStart(6, "0");
    result = {
      livePhoto: live, photo,
      video: new Blob([mp4], { type: "video/mp4" }),
      name: `potolive${code}`
    };

    $("outputs").style.display = "block";
    const warn = /mp4/i.test(src.file.type) ? "" :
      "\n⚠️ Video bukan MP4, hasil mungkin tidak bisa diputar sebagai live.";
    setStatus(`✅ Selesai: foto ${w}×${h}, ${(live.size / 1048576).toFixed(1)} MB${note}${warn}`, "ok");
  } catch (e) {
    setStatus("❌ " + e.message, "err");
  } finally {
    btn.disabled = false;
  }
};

function download(blob, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

$("btnSave").onclick  = () => result && download(result.livePhoto, `${result.name}.jpg`);
$("btnPhoto").onclick = () => result && download(result.photo, `${result.name}_foto.jpg`);
$("btnVideo").onclick = () => result && download(result.video, `${result.name}.mp4`);
$("btnShare").onclick = async () => {
  if (!result) return;
  const f = new File([result.livePhoto], `${result.name}.jpg`, { type: "image/jpeg" });
  if (navigator.canShare && navigator.canShare({ files: [f] })) {
    try { await navigator.share({ files: [f] }); } catch {}
  } else {
    setStatus("Fitur bagikan tidak didukung di sini, pakai tombol Simpan.", "err");
  }
};

// expose untuk testing
window.__lp = { makeMotionPhoto, buildXmp };
</script>
</body>
</html>
